<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 2 - Radio e CheckBox</title>
</head>

<body>
    <header></header>
    <main>
        <form action="">
            <label for="email">Insira seu email</label>
            <input type="email" name="email" id="email" required="true" placeholder="Ex : joao321@email.com">
            <br>
            <label for="nome">Insira seu nome</label>
            <input type="text" name="nome" required="true" maxlength="100" placeholder="Ex: Pedro Henrique Ferreira de Sousa">
            <br>
            <label for="color">Escolha uma cor</label>
            <input type="color" name="color" id="color">
            <br>
            <label for="">Avalie o Atendimento</label>
            <br>    
            <input type="radio" name="estrela" id="3estrelas">
            <label for="3estrelas">⭐⭐⭐</label>
            <br>
            <input type="radio" name="estrela" id="2estrelas">
            <label for="2estrelas">⭐⭐</label>
            <br>
            <input type="radio" name="estrela" id="1estrela">
            <label for="1estrela">⭐</label>
            <br>
            <label for="comentario">Deixe um comentario</label>
            <textarea name="" id="comentario" placeholder="Seu comentario aqui" cols="30" rows="10"></textarea>
            <br>
            <input type="submit" value="Enviar!">
        </form>
    </main>
    <footer></footer>
</body>

</html>
