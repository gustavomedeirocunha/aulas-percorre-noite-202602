<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cascading Stylesheet</title>
    <style>
      p {
        font-size: 500px;
      }
      #cachorro{
        color: darksalmon;
      }
      #gato {
        color: brown;
      }
    </style>
  </head>
  <body>
    <!-- CSS inline é aquele que vai dentro da própria tag-->
    <p style="color: rebeccapurple; font-size: 200px">Gustavo</p>
    <p id="cachorro">Nick</p>
    <p id="gato">Roblox</p>
  </body>
</html>
